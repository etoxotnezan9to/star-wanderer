<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Имитация полёта спутника</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #04060d;
    color: #cfd8e3;
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  #scene {
    display: block;
    width: 100%;
    height: 100%;
  }
  #panel {
    position: fixed;
    left: 12px;
    top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: min(560px, calc(100vw - 24px));
    z-index: 10;
  }
  #panel button {
    background: #12203a;
    color: #cfd8e3;
    border: 1px solid #2b3f66;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #panel button:hover {
    background: #1a2c50;
    border-color: #41598c;
  }
  #panel button.active {
    background: #23406f;
    border-color: #5b7fc4;
  }
  #help {
    position: fixed;
    left: 12px;
    bottom: 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #8296b0;
    background: rgba(4, 6, 13, 0.6);
    border: 1px solid #1c2a45;
    border-radius: 6px;
    padding: 8px 12px;
    max-width: min(520px, calc(100vw - 24px));
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <button id="btnReset" title="Встать на начало полёта">Сброс полёта</button>
  <button id="btnPlanets" title="Новое случайное расположение планет">Новое расположение планет</button>
</div>
</div>
<script src="src/simulation.js"></script>
<script src="src/main.js"></script>
</body>
</html>
