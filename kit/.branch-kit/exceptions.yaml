# Разобранные исключения средств комплекта .branch-kit/tools/.
#
# Нарушение, о котором сообщило средство, но которое нарушением не
# является, разбирают здесь записью. Новое исключение — решение: его
# вносят запросом с утверждением владельца (AGENTS.md, 2.2, 2.3).
# Исключение без причины и исключение, которое при полной проверке
# ничего не покрыло, средства считают нарушениями.
#
# Поля записи:
#   средство — имя средства, которое сообщило нарушение, например
#              check_docs.py;
#   место    — где нарушение, как оно названо в выводе средства: путь
#              файла от корня репозитория, запрос на слияние —
#              "!<номер>" в кавычках либо изменение основной ветки —
#              первые 8 знаков его обозначения в git, тоже в кавычках;
#   вид      — вид нарушения, как он назван в выводе средства;
#   абзац    — необязательно, только у файла: исключение действует
#              только на абзац (строки между пустыми строками), в тексте
#              которого есть эти слова; без поля — на всё место;
#   причина  — обязательно: почему это не нарушение.
#
# Пример записи:
#   - средство: check_docs.py
#     место: docs/history.md
#     вид: длина строки
#     абзац: "Таблица перенесена из прежнего отчёта"
#     причина: строки таблицы перенесены дословно из прежнего отчёта.
#
# Исключений нет — список пуст.
исключения: []
