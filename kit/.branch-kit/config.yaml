# Настройка комплекта веточной разработки для этого репозитория.
#
# Файл читают агенты вместе с AGENTS.md перед любой работой и средства
# комплекта в .branch-kit/tools/. Заполняют его, когда ставят комплект, а
# меняют, как и раздел 8 AGENTS.md, запросом с новым решением
# (AGENTS.md, 2.2).
#
# Над полем — подсказка: обязательно ли, что в нём, где правило. Места в
# угловых скобках заменяют вместе со скобками; средства не запускаются,
# пока в значениях осталось место вида <…>. Ключей, паролей и локальных
# путей здесь нет (AGENTS.md, 7.2): для ключей и базы рабочих каталогов
# названы только переменные окружения, в которых они лежат.

# Обязательно. Откуда взят комплект и какое его изменение стоит: адрес
# репозитория комплекта и первые 8 знаков обозначения изменения в git.
# Заполняет тот, кто ставит или обновляет комплект (.branch-kit/README.md).
комплект:
  источник: <адрес репозитория комплекта>
  изменение: <8 знаков>

# Обязательно. Площадка GitLab и этот репозиторий на ней (AGENTS.md, 4.2,
# 7.1). Адрес — целиком, с http:// или https://; узел площадки для
# glab api --hostname — тот же адрес без http:// или https://.
площадка:
  адрес: <адрес площадки>
  группа: <группа>
  репозиторий: <группа>/<репозиторий>

# Обязательно. Основная ветка: в неё сливают запросы, напрямую в неё не
# пишет никто (AGENTS.md, 3.1).
основная ветка: main

# Обязательно. Префиксы веток задач и что под каждым (AGENTS.md, 3.2).
# Тип в сообщении к изменению — префикс без косой черты (3.3). Защиту
# веток задач по этим префиксам ставит владелец средством
# owner_protect_branches.py.
ветки задач:
  - префикс: docs/
    что: документы
  - префикс: feat/
    что: новое
  - префикс: fix/
    что: исправления
  - префикс: chore/
    что: устройство репозитория
  - префикс: test/
    что: проверки

# Обязательно. Учётные записи ролей (AGENTS.md, раздел 1).
#   учётная запись   — имя на площадке;
#   переменная ключа — имя переменной окружения пользователя, в которой
#                      лежит ключ этой учётной записи (AGENTS.md, 6.3);
#                      самого ключа здесь нет;
#   подпись          — имя и адрес почты для git config user.name и
#                      user.email (6.4, 6.6); у кого изменений нет,
#                      подписи нет.
учётные записи:
  # Владелец репозитория: утверждает решения, арбитр, меняет настройки
  # площадки (AGENTS.md, 1.1). Ключ для своих средств он хранит сам.
  владелец: <учётная запись владельца>
  # Постановщик (1.2): на площадке — Reporter, чтение и заметки.
  постановщик:
    учётная запись: <учётная запись постановщика, например ai-planner>
    переменная ключа: BRANCH_KIT_PLANNER_TOKEN
  # Авторы (1.3): на площадке — Developer. Можно несколько; у каждого
  # своя переменная ключа.
  авторы:
    - учётная запись: <учётная запись автора, например ai-dev>
      переменная ключа: BRANCH_KIT_AUTHOR_TOKEN
      подпись:
        имя: <имя для подписи, например AI Developer>
        почта: <адрес почты>
  # Проверяющий (1.4): на площадке — Maintainer, сливает запросы.
  проверяющий:
    учётная запись: <учётная запись проверяющего, например ai-reviewer>
    переменная ключа: BRANCH_KIT_REVIEWER_TOKEN
    подпись:
      имя: <имя для подписи, например AI Reviewer>
      почта: <адрес почты>
  # Необязательно. Люди, которые ставят задачи агентам и пишут заметки
  # своей учётной записью (1.5); роль — аналитик или разработчик. Людей
  # нет — пустой список: люди: []
  люди:
    - учётная запись: <учётная запись>
      роль: <аналитик или разработчик>

# Обязательно. Проверки репозитория (AGENTS.md, 4.7): их по порядку
# выполняет check_repo.py. Перед подачей запроса их выполняет автор, на
# результате слияния со свежей основной веткой — проверяющий (2.6).
#   имя       — короткое имя латиницей, им проверка названа в выводе и в
#               таблице AGENTS.md, 8.3;
#   команда   — команда, выполняется из корня клона: в Linux — оболочкой
#               sh, в Windows — cmd; если команды для Windows и Linux
#               разные, вместо «команда» пишут два поля: «windows» и
#               «linux». Команда, начинающаяся словом python, выполняется
#               тем же Python, что и check_repo.py;
#   успех     — что считается успехом: код выхода (без поля — 0) и,
#               необязательно, строка, которая должна быть в выводе
#               целой строкой, без пробелов по краям;
#   не дольше — необязательно: срок в минутах; после него проверка
#               прерывается и считается непрошедшей.
# Проверка документов ниже — пример средства комплекта; сборку, тесты и
# линтеры добавляют, когда ставят комплект. Что каждая проверка падает на
# испорченном входе, записывают в AGENTS.md, 8.3.
проверки:
  - имя: docs
    команда: python .branch-kit/tools/check_docs.py
    успех:
      код выхода: 0
      строка в выводе: нарушений 0
  - имя: <имя проверки, например build>
    windows: <команда в Windows>
    linux: <команда в Linux>
    успех:
      код выхода: 0
    не дольше: 30

# Необязательно. Конвейер (GitLab CI, Jenkins) — по желанию. Если он есть,
# его итог для вершины ветки виден на площадке статусом изменения, и
# проверяющий называет его в сводке рядом со своими проверками
# (AGENTS.md, 2.6). Нет конвейера — есть: false.
#   статусы — имена статусов вершины на площадке, которые учитываются;
#             пустой список — все статусы вершины.
конвейер:
  есть: false
  статусы: []

# Обязательно. Опрос площадки (AGENTS.md, 4.3), в минутах:
#   период    — сколько ждать между обращениями к площадке;
#   не дольше — через сколько команда опроса завершается без события,
#               чтобы её подняли снова; 0 — без срока. Срок нужен, если
#               среда прерывает или теряет долгие команды: потерянный
#               опрос со сроком завершится сам. Команду со сроком 10
#               Cursor держит до конца (проверено пробой); со сроком 20
#               её держал до конца Cursor 3.24.12 в Ubuntu 22.04
#               (проверено 19.10.2026). На других системах дольше 10
#               минут не проверено, а по сообщениям пользователей Cursor
#               он обрывает команду примерно через 10 минут. Чем больше
#               срок, тем реже повторы опроса: после нескольких пустых
#               повторов подряд Cursor останавливает агента как цикл.
опрос:
  период: 2
  не дольше: 10

# Обязательно. Рабочие каталоги (AGENTS.md, 6.5): переменная окружения
# пользователя, в которой лежит база; клоны — <база>/clones/<имя работы>.
# Переменной нет на машине — агент спрашивает того, кто дал задание.
рабочие каталоги:
  переменная базы: BRANCH_KIT_WORK_ROOT

# Обязательно. Реестр отложенного (AGENTS.md, 4.9): путь от корня
# репозитория.
реестр отложенного: .branch-kit/deferred.md

# Необязательно. Формат документов (AGENTS.md, 5.2, 5.4); его проверяет
# check_docs.py. Значения ниже — пример составителей комплекта, а не
# обязательство: их меняют под принятое в репозитории. Нет поля — нет
# требований к формату документов, и проверки docs в «проверки» нет.
формат документов:
  # Какие файлы проверяются: маски путей от корня; «*» совпадает и с
  # косой чертой, как в pathspec git (git ls-files), в отличие от
  # .gitignore: «*.md» — все файлы .md репозитория.
  файлы:
    - "*.md"
  # utf-8 без BOM или utf-8 с BOM.
  кодировка: utf-8 без BOM
  # LF или CRLF.
  концы строк: LF
  # В конце файла перевод строки: true или false.
  перевод строки в конце: true
  # Наибольшая длина строки вне таблиц и блоков кода; 0 — не проверяется.
  длина строки: 78
  # Относительные ссылки Markdown ведут на пути, которые отслеживает git
  # и которые лежат на диске: true или false.
  ссылки: true
  # Файлы YAML и блоки yaml в документах разбираются: true или false.
  yaml: true
  # Слова, которые не употребляются (AGENTS.md, 5.2). Запись: слово;
  # образец — регулярное выражение Python, которое ловит формы слова
  # (регистр букв не важен, \b — граница слова); вместо — чем заменить.
  # Образец пишут без того, что есть только в новых Python: атомарной
  # группы (?>…), повторов *+, ++, ?+ и \z; флаги вида (?i) — только в
  # самом начале образца. Средства работают на Python 3.8 и новее, и
  # образец, который разбирают не все эти версии, сверка настройки не
  # пропустит.
  # Пример записи:
  #   - слово: фича
  #     образец: '\bфич\w*'
  #     вместо: новая возможность
  слова: []
